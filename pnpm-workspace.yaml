packages:
  - 'apps/*'
  - 'apps/packages/*'

# pnpm v10 build-script allowlist
onlyBuiltDependencies:
  - bcrypt
  - esbuild
  - sharp

# pnpm v11 build-script allowlist
allowBuilds:
  '@apollo/protobufjs': set this to true or false
  bcrypt: true
  esbuild: true
  msw: set this to true or false
  sharp: true
strictDepBuilds: false
